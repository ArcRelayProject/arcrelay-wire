syntax = "proto3";
package arcrelay.v1;


message Empty {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED          = 0;
  ERROR_CODE_OK                   = 1;
  ERROR_CODE_INVALID_ARGUMENT     = 2;
  ERROR_CODE_UNAUTHENTICATED      = 3;
  ERROR_CODE_PERMISSION_DENIED    = 4;
  ERROR_CODE_NOT_FOUND            = 5;
  ERROR_CODE_BUSY                 = 6;
  ERROR_CODE_RESOURCE_EXHAUSTED   = 7;
  ERROR_CODE_FAILED_PRECONDITION  = 8;
  ERROR_CODE_CANCELLED            = 9;
  ERROR_CODE_DEADLINE_EXCEEDED    = 10;
  ERROR_CODE_UNAVAILABLE          = 11;
  ERROR_CODE_UNSUPPORTED          = 12;
  ERROR_CODE_INTERNAL             = 13;
  ERROR_CODE_CONFLICT             = 14;
}

enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED        = 0;
  RECOVERY_ACTION_NONE               = 1;
  RECOVERY_ACTION_RETRY              = 2;
  RECOVERY_ACTION_RETRY_WITH_BACKOFF = 3;
  RECOVERY_ACTION_REFRESH            = 4;
  RECOVERY_ACTION_CHANGE_REQUEST     = 5;
}

message Status {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint32 retry_after_ms = 4;
  RecoveryAction recovery_action = 5;
  // Present for internal failures so clients can report the incident without
  // receiving implementation details.
  string error_id = 6;
}
